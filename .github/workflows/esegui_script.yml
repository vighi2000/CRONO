name: Esegui Script Richiami 2 Volte al Giorno

on:
  schedule:
    # Esegue in automatico ogni giorno alle 08:00 e alle 20:00 UTC
    - cron: '0 9,16 * * *'
  
  # Ti permette di avviarlo anche manualmente da GitHub
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
      - name: Copia i file del repository
        uses: actions/checkout@v3

      - name: Installa Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa le librerie
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui lo script Python
        run: python scarica_richiami.py

      - name: Salva il file JSON sul repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add richiami_ministero.json
          git commit -m "Aggiornamento automatico dei dati" || echo "Nessuna modifica da salvare"
          git push
