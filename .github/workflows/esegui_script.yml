- name: Salva il file JSON aggiornato nel repository
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add allerte_rasff_italia.json
          
          # Controlla se il file ha subito modifiche
          if git diff --staged --quiet; then
            echo "Nessun nuovo dato da aggiornare. Evito il push."
          else
            # Se ci sono modifiche, salva e invia a GitHub
            git commit -m "🤖 Aggiornamento automatico allerte RASFF Italia"
            git pull origin main --rebase
            git push
          fi